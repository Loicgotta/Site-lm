<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Business School - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="logo">
                <h1>NovaBS</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contact Section -->
    <section class="contact-page">
        <div class="container">
            <h1>Contact Us</h1>
            <p class="intro">Have questions? Fill out the form below!</p>

            <!-- Contact Form -->
            <div class="contact-form">
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="lastname">Last Name</label>
                            <input type="text" id="lastname" name="lastname" required>
                        </div>
                        <div class="form-group">
                            <label for="firstname">First Name</label>
                            <input type="text" id="firstname" name="firstname" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" min="16" max="100">
                        </div>
                        <div class="form-group">
                            <label for="intake">Intake Date</label>
                            <input type="date" id="intake" name="intake">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="program">Program</label>
                        <select id="program" name="program">
                            <option value="">Select a program</option>
                            <option value="business">Business Management</option>
                            <option value="marketing">Digital Marketing</option>
                            <option value="international">International Business</option>
                            <option value="finance">Finance</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5"></textarea>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">Send</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                </form>
            </div>

            <!-- Map and Video Section -->
            <div class="extras">
                <div class="map-container">
                    <h3>Our Location</h3>
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624.9914406081493!2d2.292292615674934!3d48.85837007928746!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66fec70fb1d8d%3A0x66e8832b17e14b0!2sEiffel%20Tower!5e0!3m2!1sen!2sfr!4v1638360000000!5m2!1sen!2sfr" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
                <div class="video-container">
                    <h3>School Promo Video</h3>
                    <iframe width="100%" height="300" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="School Promo" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>Email: contact@novabs.edu</p>
                </div>
                <div class="footer-social">
                    <a href="#">LinkedIn</a>
                    <a href="#">Instagram</a>
                    <a href="#">YouTube</a>
                </div>
            </div>
            <p class="copyright">&copy; 2025 Nova Business School</p>
        </div>
    </footer>
</body>
</html>
