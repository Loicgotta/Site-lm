<!DOCTYPE html>
<html>
<head>
  <title>OAuth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #333;
      border-top: 4px solid #4285f4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Authentification en cours...</p>
  </div>
  <script>
    // Récupérer le code d'autorisation depuis l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const error = urlParams.get('error');

    if (error) {
      document.querySelector('.container').innerHTML = `
        <p style="color: #ff6b6b;">Erreur: ${error}</p>
        <p>Cette fenêtre va se fermer...</p>
      `;
      setTimeout(() => window.close(), 3000);
    } else if (code) {
      // Passer le code à la fenêtre parente
      if (window.opener && window.opener.oauthCallback) {
        window.opener.oauthCallback(code);
        document.querySelector('.container').innerHTML = `
          <p style="color: #51cf66;">✓ Authentification réussie!</p>
          <p>Cette fenêtre va se fermer...</p>
        `;
        setTimeout(() => window.close(), 1500);
      } else {
        document.querySelector('.container').innerHTML = `
          <p style="color: #ff6b6b;">Erreur: Impossible de communiquer avec la fenêtre principale</p>
        `;
      }
    } else {
      document.querySelector('.container').innerHTML = `
        <p style="color: #ff6b6b;">Erreur: Pas de code d'autorisation reçu</p>
      `;
    }
  </script>
</body>
</html>
